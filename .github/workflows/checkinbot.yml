name: Scheduled Check-In Bot

on:
  schedule:
    # Runs 3x/day (UTC): 9 AM, 3 PM, 9 PM Central during CDT.
    # Three runs a day gives margin if one run fails, without the churn of
    # running every 30 minutes. None of these land in 04:00-06:00 UTC, the
    # window the instructor flagged as risky (a late run there can slip past
    # midnight Central and miss a day).
    - cron: "0 14,20,2 * * *"
  workflow_dispatch:

# Prevents two runs from ever executing at the same time (e.g. a slow run still
# going when the next scheduled trigger fires). Without this, overlapping runs
# could race on the final git push, or both post a reply before either one
# sees the other's comment. cancel-in-progress is false so a run already
# talking to the API is allowed to finish instead of being cut off mid-reply -
# the next run just waits its turn.
concurrency:
  group: checkinbot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Needed so the "Commit artifact" step below can push back to this repo
    # using the automatically-provided GITHUB_TOKEN.
    permissions:
      contents: write
    env:
      PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
      PRACTICE_API_URL: ${{ secrets.PRACTICE_API_URL }}
      INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checkinbot.py
        run: python checkinbot.py

      - name: Commit and push artifact changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifact/
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Update artifact from scheduled run"
            git push
          fi
